<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>root</title>
<style>
  body { background-color: #000; color: #0f0; font-family: monospace; padding: 2rem; margin: 0; }
</style>
</head>
<body>

<canvas id="s7r4-rain"></canvas>

<div id="s7r4-root">

  <style>
    #s7r4-rain {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      opacity: 0.06;
      pointer-events: none;
      z-index: 0;
    }
    #s7r4-root {
      position: relative;
      z-index: 2;
      max-width: 700px;
      margin: 0 auto;
      padding: 2rem 1rem 6rem;
      line-height: 1.8;
      font-size: 1rem;
    }
    #s7r4-root .glitch-title {
      font-size: 2rem;
      font-weight: bold;
      letter-spacing: 0.15em;
      margin-bottom: 0.3rem;
      text-shadow: 0 0 8px #0f0, 0 0 2px #0f0;
      animation: crtFlicker 4s infinite;
      position: relative;
    }
    #s7r4-root .subtitle {
      font-size: 0.8rem;
      color: #0a0;
      opacity: 0.7;
      margin-bottom: 2.5rem;
      letter-spacing: 0.1em;
    }
    #s7r4-root p {
      margin-bottom: 1.1rem;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.9s ease, transform 0.9s ease;
      text-shadow: 0 0 3px rgba(0,255,0,0.35);
      position: relative;
    }
    #s7r4-root p.visible {
      opacity: 1;
      transform: translateY(0);
    }
    #s7r4-root .signal-line {
      font-size: 0.85rem;
      color: #0a0;
      opacity: 0.6;
      letter-spacing: 0.15em;
    }
    #s7r4-root .movement-tag {
      display: block;
      color: #0a0;
      opacity: 0;
      font-size: 0.75rem;
      letter-spacing: 0.25em;
      text-transform: lowercase;
      margin: 2.4rem 0 0.9rem;
      border-top: 1px solid rgba(0,255,0,0.15);
      padding-top: 1.2rem;
      transition: opacity 1.1s ease;
    }
    #s7r4-root .movement-tag.visible {
      opacity: 0.55;
    }
    #s7r4-root .divider {
      text-align: center;
      opacity: 0;
      color: #0a0;
      letter-spacing: 0.4em;
      margin: 0.4rem 0;
      transition: opacity 1s ease;
    }
    #s7r4-root .divider.visible { opacity: 0.4; }

    /* RGB split / chromatic aberration burst — relic malfunction style */
    #s7r4-root p.rgb-glitch, #s7r4-root .movement-tag.rgb-glitch {
      animation: rgbSplit 0.35s steps(2, end);
    }
    @keyframes rgbSplit {
      0% { text-shadow: 0 0 3px rgba(0,255,0,0.35); transform: translate(0,0); }
      20% {
        text-shadow: -2px 0 #ff2d6f, 2px 0 #00f0ff, 0 0 3px rgba(0,255,0,0.35);
        transform: translate(-1px, 0);
      }
      40% {
        text-shadow: 2px 0 #ff2d6f, -2px 0 #00f0ff, 0 0 3px rgba(0,255,0,0.35);
        transform: translate(1px, 0);
      }
      60% {
        text-shadow: -1px 0 #ff2d6f, 1px 0 #00f0ff, 0 0 3px rgba(0,255,0,0.35);
        transform: translate(0, 0);
      }
      100% { text-shadow: 0 0 3px rgba(0,255,0,0.35); transform: translate(0,0); }
    }

    @keyframes crtFlicker {
      0%, 100% { opacity: 1; }
      92% { opacity: 1; }
      93% { opacity: 0.4; }
      94% { opacity: 1; }
      96% { opacity: 0.7; }
      97% { opacity: 1; }
    }

    #s7r4-scanlines {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: repeating-linear-gradient(
        0deg,
        rgba(0,255,0,0.02) 0px,
        rgba(0,255,0,0.02) 1px,
        transparent 1px,
        transparent 3px
      );
      pointer-events: none;
      z-index: 3;
    }

    .tear-bar {
      position: fixed;
      left: 0;
      width: 100vw;
      height: 3px;
      pointer-events: none;
      z-index: 4;
      opacity: 0;
    }
    .tear-bar.active {
      animation: tearFlash 0.18s linear;
    }
    @keyframes tearFlash {
      0% {
        opacity: 0.95;
        box-shadow: -3px 0 6px #ff2d6f, 3px 0 6px #00f0ff, 0 0 10px rgba(0,255,0,0.8);
        background: #0f0;
      }
      100% { opacity: 0; }
    }

    .screen-glitch #s7r4-root {
      animation: screenDisplace 0.25s steps(3, end);
    }
    @keyframes screenDisplace {
      0% { transform: translate(0,0); filter: none; }
      25% { transform: translate(-4px, 1px); filter: hue-rotate(15deg); }
      50% { transform: translate(3px, -2px); filter: hue-rotate(-10deg); }
      75% { transform: translate(-2px, 0); filter: hue-rotate(5deg); }
      100% { transform: translate(0,0); filter: none; }
    }

    #s7r4-eye-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      z-index: 10;
      transition: opacity 0.06s ease-out;
    }
    #s7r4-eye-overlay.flash {
      opacity: 0.9;
      transition: opacity 0.04s ease-out;
    }
    #s7r4-eye-overlay img {
      max-width: 55vw;
      max-height: 55vh;
      opacity: 0.85;
      filter: drop-shadow(0 0 30px rgba(0,255,0,0.4));
    }

    /* Final section gets a slightly distinct treatment — the "real" voice breaking through */
    #s7r4-root .final-section {
      margin-top: 3rem;
      padding-top: 2rem;
      border-top: 1px solid rgba(0,255,0,0.2);
    }
  </style>
